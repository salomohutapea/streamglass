[project]
name = "streamglass-backend"
version = "1.0.2"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["mitmproxy==12.2.3+streamglass.1", "aiohttp==3.14.5"]

[project.optional-dependencies]
package = ["pyinstaller>=6.12,<7"]

[project.scripts]
streamglass-backend = "backend.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
